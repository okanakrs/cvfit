<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Başarılı - CVFit</title>
<link rel="icon" type="image/x-icon" href="/medias/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/medias/cvfit-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/medias/cvfit-apple-touch-icon.png">
<meta name="theme-color" content="#3730a3">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { background: #0a0a0f; color: #e8e8f0; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { text-align: center; max-width: 400px; padding: 24px; }
  .icon { font-size: 64px; margin-bottom: 24px; }
  h1 { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin-bottom: 12px; }
  p { color: #6b6b80; font-size: 15px; margin-bottom: 32px; line-height: 1.6; }
  a { display: inline-block; background: linear-gradient(135deg, #7c6aff, #9b6aff); color: white; text-decoration: none; padding: 14px 32px; border-radius: 12px; font-weight: 700; font-size: 15px; transition: all 0.2s; }
  a:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,106,255,0.4); }
  .status { color: #6affcc; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🎉</div>
  <h1>Ödeme Başarılı!</h1>
  <p class="status" id="statusMsg">Planınız aktifleştiriliyor...</p>
  <p>Artık CV'nizi iş ilanlarına göre sınırsız uyarlayabilirsiniz.</p>
  <a href="/">CVFit'e Dön</a>
</div>

<script>
  const plan = "{{ plan }}";
  const token = localStorage.getItem("cvfit_access_token");

  async function confirmPayment() {
    if (!token) {
      document.getElementById("statusMsg").textContent = "";
      return;
    }
    try {
      const res = await fetch("/api/payment/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ access_token: token, plan: plan })
      });
      if (res.ok) {
        document.getElementById("statusMsg").textContent = "✅ Planınız aktifleştirildi!";
      }
    } catch(e) {
      document.getElementById("statusMsg").textContent = "";
    }
  }

  confirmPayment();
</script>
</body>
</html>
