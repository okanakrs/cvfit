<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVFit - Giriş Yapılıyor...</title>
<link rel="icon" type="image/x-icon" href="/medias/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/medias/cvfit-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/medias/cvfit-apple-touch-icon.png">
<meta name="theme-color" content="#3730a3">
<style>
  body { background: #0a0a0f; color: #e8e8f0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
  .box { text-align: center; }
  .spinner { width: 48px; height: 48px; border: 3px solid #2a2a3a; border-top-color: #7c6aff; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #6b6b80; font-size: 15px; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <p id="msg">Giriş yapılıyor...</p>
</div>
<script>
  // Supabase bazen token'ı URL fragment'te (#access_token=...) gönderir
  // Bazen query param olarak (?code=...) gönderir - server handle eder

  // Server tarafından gelen token (PKCE flow)
  const serverAccessToken  = "{{ access_token }}";
  const serverRefreshToken = "{{ refresh_token }}";
  const serverError        = "{{ error }}";

  // Fragment'ten token al (implicit flow)
  function getFragmentParam(name) {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    return params.get(name);
  }

  const fragmentAccessToken  = getFragmentParam("access_token");
  const fragmentRefreshToken = getFragmentParam("refresh_token");

  const accessToken  = (serverAccessToken && serverAccessToken !== "None" && serverAccessToken !== "")
                        ? serverAccessToken
                        : fragmentAccessToken;
  const refreshToken = (serverRefreshToken && serverRefreshToken !== "None" && serverRefreshToken !== "")
                        ? serverRefreshToken
                        : fragmentRefreshToken;

  if (accessToken) {
    localStorage.setItem("cvfit_access_token",  accessToken);
    localStorage.setItem("cvfit_refresh_token", refreshToken || "");
    document.getElementById("msg").textContent = "Giriş başarılı! Yönlendiriliyorsunuz...";
    setTimeout(() => window.location.href = "/", 1000);
  } else if (serverError && serverError !== "None" && serverError !== "") {
    document.getElementById("msg").textContent = "Giriş başarısız: " + serverError;
    setTimeout(() => window.location.href = "/", 3000);
  } else {
    // Belki fragment henüz yüklenmedi, kısa bekle
    setTimeout(() => {
      const retryToken = getFragmentParam("access_token");
      if (retryToken) {
        localStorage.setItem("cvfit_access_token", retryToken);
        localStorage.setItem("cvfit_refresh_token", getFragmentParam("refresh_token") || "");
        window.location.href = "/";
      } else {
        document.getElementById("msg").textContent = "Giriş başarısız: Token bulunamadı. Lütfen tekrar deneyin.";
        setTimeout(() => window.location.href = "/", 3000);
      }
    }, 500);
  }
</script>
</body>
</html>
