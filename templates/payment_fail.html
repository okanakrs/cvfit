<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ödeme Başarısız - CVFit</title>
<link rel="icon" type="image/x-icon" href="/medias/favicon.ico">
<link rel="icon" type="image/png" sizes="192x192" href="/medias/cvfit-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/medias/cvfit-apple-touch-icon.png">
<meta name="theme-color" content="#355adf">
<style>
    :root {
      --bg: #f6f7fb;
      --bg-soft: #ffffff;
      --fg: #101423;
      --muted: #5c647a;
      --border: #dde2ef;
      --brand: #355adf;
      --brand-soft: rgba(53, 90, 223, 0.12);
      --err: #dc2626;
      --err-soft: rgba(220, 38, 38, 0.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --bg-soft: #111727;
        --fg: #eef1ff;
        --muted: #9ca6c8;
        --border: #212c47;
        --brand: #7d9bff;
        --brand-soft: rgba(125, 155, 255, 0.18);
        --err: #f87171;
        --err-soft: rgba(248, 113, 113, 0.16);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", "Inter", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background:
        radial-gradient(900px 420px at 50% -140px, var(--brand-soft), transparent 65%),
        radial-gradient(500px 220px at 80% 120%, rgba(82, 121, 255, 0.08), transparent 60%),
        var(--bg);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .page { width: min(92vw, 560px); }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo-box {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--fg);
      color: var(--bg-soft);
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -0.5px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
    }

    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.25px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 30px 28px 24px;
      background: color-mix(in oklab, var(--bg-soft) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow:
        0 20px 60px rgba(8, 14, 31, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--bg-soft) 90%, transparent);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1px;
      padding: 8px 13px;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--err);
      box-shadow: 0 0 0 7px color-mix(in oklab, var(--err) 24%, transparent);
      animation: pulse 1.5s ease-out infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--err) 24%, transparent); }
      100% { box-shadow: 0 0 0 9px rgba(0, 0, 0, 0); }
    }

    .icon-wrap {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--err-soft);
      border: 1px solid color-mix(in oklab, var(--err) 45%, var(--border));
    }

    .icon { font-size: 28px; color: var(--err); }

    h1 {
      font-size: 31px;
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.1;
    }

    .description {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 34ch;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin-top: 4px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 18px;
      border-radius: 11px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
      cursor: pointer;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(135deg, #355adf, #5677ee);
      box-shadow: 0 10px 24px rgba(53, 90, 223, 0.28);
    }

    .btn-primary:hover { transform: translateY(-1px); }

    .btn-secondary {
      color: var(--muted);
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--bg-soft) 90%, transparent);
    }

    .btn-secondary:hover { opacity: 0.9; }

    @media (max-width: 540px) {
      .card { padding: 26px 20px 20px; border-radius: 18px; }
      h1 { font-size: 27px; }
    }
</style>
</head>
<body>
<main class="page">
  <div class="logo" aria-label="CVFit logosu">
    <div class="logo-box">CV</div>
    <span class="logo-text">Fit</span>
  </div>

  <section class="card" aria-live="polite">
    <div class="badge">
      <span class="badge-dot"></span>
      Ödeme işlemi tamamlanamadı
    </div>

    <div class="icon-wrap">
      <span class="icon">✕</span>
    </div>

    <h1>Ödeme Başarısız</h1>
    <p class="description">Ödemeniz tamamlanamadı. Kart bilgilerinizi ve banka onayını kontrol edip tekrar deneyebilirsiniz.</p>

    <div class="divider"></div>

    <div class="actions">
      <a href="/" class="btn btn-primary" onclick="history.back(); return false;">Tekrar Dene</a>
      <a href="/" class="btn btn-secondary">Ana Sayfaya Dön</a>
    </div>
  </section>
</main>
</body>
</html>
