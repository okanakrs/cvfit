<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>

  <!-- Outer document rect -->
  <rect x="4" y="2" width="17" height="21" rx="4" stroke="#F8FAFC" stroke-width="1.2" fill="none"/>
  <!-- Inner document rect -->
  <rect x="6.5" y="4.5" width="12" height="16" rx="2.5" stroke="#F8FAFC" stroke-width="1" fill="none"/>

  <!-- Text lines -->
  <rect x="9" y="8.5"  width="7"   height="1.5" rx="0.75" fill="#F8FAFC"/>
  <rect x="9" y="11.5" width="5.5" height="1.5" rx="0.75" fill="#F8FAFC" opacity="0.6"/>
  <rect x="9" y="14.5" width="6.5" height="1.5" rx="0.75" fill="#F8FAFC" opacity="0.6"/>

  <!-- Horizontal score line -->
  <line x1="3" y1="17.5" x2="22.5" y2="17.5" stroke="#F8FAFC" stroke-width="1" opacity="0.8"/>
  <!-- Circle on left of line -->
  <circle cx="3" cy="17.5" r="2" fill="#F8FAFC"/>

  <!-- Sparkle (top-right) -->
  <polygon
    points="27,3  27.7,5.3  30,6  27.7,6.7  27,9  26.3,6.7  24,6  26.3,5.3"
    fill="#F8FAFC"
  />
  <polygon
    points="27,4.8  27.3,5.7  28.2,6  27.3,6.3  27,7.2  26.7,6.3  25.8,6  26.7,5.7"
    fill="#0F172A"
  />
</svg>
